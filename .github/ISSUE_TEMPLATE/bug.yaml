name: Bug
description: Something is not working as expected or it is not clear what to do.
title: "[BUG] <title>"
labels: [bug, needs triage]
body:
- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if an issue already exists for the bug you encountered.
    options:
    - label: I have searched the existing issues
      required: true
- type: dropdown
  id: microhack
  attributes:
    label: Microhack
    description: Which MicroHack are you referring to?
    options:
      - 03-Azure/01-01-App Innovation/01_AppServicetoContainerApps
      - 03-Azure/01-01-App Innovation/02_AKS
      - 03-Azure/01-01-App Innovation/03_GHCPAppModernization
      - 03-Azure/01-01-App Innovation/04-adaptive-apps
      - 03-Azure/01-01-App Innovation/05_AppModernizationWithSecurity
      - 03-Azure/01-02 Data/01-ADX-Microhack
      - 03-Azure/01-02 Data/02-SQL_Modernization
      - 03-Azure/01-02 Data/03-Talk_to_your_data
      - 03-Azure/01-03-Infrastructure/01_Sovereign_Cloud
      - 03-Azure/01-03-Infrastructure/02_Hybrid_Azure_Arc_Servers
      - 03-Azure/01-03-Infrastructure/03_Hybrid_Azure_Arc_Kubernetes
      - 03-Azure/01-03-Infrastructure/04_BCDR_Azure_Native
      - 03-Azure/01-03-Infrastructure/05_Azure_VMware_Solution
      - 03-Azure/01-03-Infrastructure/06_Migration_Secure_AI_Ready
      - 03-Azure/01-03-Infrastructure/07_Azure_Monitor
      - 03-Azure/01-03-Infrastructure/10_Oracle_on_Azure
      - 03-Azure/01-03-Infrastructure/11_Azure_NetApp_Files_Microhack_VDI_AVD
      - 03-Azure/01-03-Infrastructure/12_Azure_Copilot
      - 03-Azure/01-04-AI/01_Agentic_SDLC
      - 03-Azure/01-04-AI/02_Inventory_Planning_Fabric
      - 03-Azure/01-04-AI/03_Inventory_Planning_Agentic
      - 03-Azure/01-04-AI/04_Agentic_Contract_Lifecycle_Management
      - 03-Azure/01-04-AI/05_Claims_Processing
      - 03-Azure/01-04-AI/06_AI_Governance
      - 03-Azure/01-04-AI/07_Fraud_Intelligence
      - 03-Azure/01-04-AI/08_Predictive_Maintenance
      - 03-Azure/01-04-AI/09_Air_Gapped_Agentic_Edge_AI
      - 03-Azure/01-04-AI/11_Healthcare_Regulatory_Intelligence
      - 03-Azure/01-04-AI/12_Contact_Center
      - 03-Azure/01-04-AI/13_Frontier_Operations
      - 03-Azure/01-05-SAP/01_MicroHack-SAP-Cashflow-Prediction
      - 03-Azure/01-05-SAP/02_SAP_Teams_Integration_with_GenAI
  validations:
    required: true
- type: textarea
  attributes:
    label: Current Behavior
    description: A concise description of what you're experiencing.
  validations:
    required: false
- type: textarea
  attributes:
    label: Expected Behavior
    description: A concise description of what you expected to happen.
  validations:
    required: false
- type: textarea
  attributes:
    label: Steps To Reproduce
    description: Steps to reproduce the behavior.
    placeholder: |
      1. In this environment...
      1. With this config...
      1. Run '...'
      1. See error...
  validations:
    required: false
- type: textarea
  attributes:
    label: Anything else?
    description: |
      Links? References? Anything that will give us more context about the issue you are encountering!

      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
  validations:
    required: false
