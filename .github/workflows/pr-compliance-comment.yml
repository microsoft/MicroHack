name: PR Compliance Comment

# Posts the result of "PR Compliance Check" as a PR comment.
# Runs in the context of the base repository (write token available, also for forks),
# only reads the artifact produced by the check, and never checks out PR code.
# Note: workflow_run triggers only fire for workflow files on the default branch.

on:
  workflow_run:
    workflows: ["PR Compliance Check"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: pr-compliance-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download PR comment artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-compliance-comment
          path: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Create or update PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const marker = '<!-- pr-compliance-check -->';
            const legacyFooter = 'automatically generated by the PR Compliance Check workflow';
            const maxLength = 60000;

            // The artifact comes from untrusted PR code: validate the PR number
            // against the commit that was actually checked.
            const prNumber = Number(fs.readFileSync('pr-comment/pr-number.txt', 'utf8').trim());
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed('Invalid PR number in artifact.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.head.sha !== run.head_sha) {
              core.info(`PR #${prNumber} head (${pr.head.sha}) does not match checked commit (${run.head_sha}); skipping.`);
              return;
            }

            let body = fs.readFileSync('pr-comment/pr-comment.md', 'utf8');
            if (body.length > maxLength) {
              body = body.slice(0, maxLength);
              if ((body.match(/```/g) || []).length % 2 === 1) {
                body += '\n```';
              }
              body += `\n\n> ⚠️ **Report truncated.** See the [full results in the workflow run](${run.html_url}).`;
            }
            body = `${marker}\n${body}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.filter(c =>
              c.user?.login === 'github-actions[bot]' &&
              (c.body?.includes(marker) || c.body?.includes(legacyFooter)));

            const passed = run.conclusion === 'success';
            if (existing.length === 0) {
              if (passed) {
                core.info('Checks passed and no previous compliance comment exists; nothing to post.');
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              core.info(`Created compliance comment on PR #${prNumber}.`);
              return;
            }

            const [latest, ...older] = existing.reverse();
            await github.rest.issues.updateComment({ owner, repo, comment_id: latest.id, body });
            core.info(`Updated compliance comment ${latest.id} on PR #${prNumber}.`);
            for (const c of older) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
            }
