spring.application.name=mh-catalog-java
spring.datasource.url=jdbc:postgresql://${CATALOG_DATABASE_HOST}:${CATALOG_DATABASE_PORT:5432}/${CATALOG_DATABASE_NAME}?sslmode=${CATALOG_DATABASE_SSL_MODE:prefer}&ApplicationName=mh-catalog-java
spring.datasource.username=${CATALOG_DATABASE_USERNAME}
spring.datasource.password=${CATALOG_DATABASE_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.show_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.encoded-solidus-handling=passthrough
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=false
