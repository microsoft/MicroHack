[project]
name = "claims-microhack"
version = "0.1.0"
description = "Runtime environment for the ClaimSight Claims MicroHack"
requires-python = ">=3.11,<3.12"
dependencies = [
  "agent-framework-core==1.13.0",
  "agent-framework-foundry==1.10.4",
  "azure-ai-projects==2.3.0",
  "azure-core==1.41.0",
  "azure-identity==1.25.3",
  "azure-search-documents==12.0.0",
  "azure-storage-blob==12.27.1",
  "httpx==0.28.1",
  "pydantic==2.11.10",
  "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
  "ipykernel",
  "ipywidgets",
  "pytest",
  "ruff",
  "tqdm",
]

[tool.uv]
package = false
