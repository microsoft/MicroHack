[project]
name = "predictive-maintenance-hack"
version = "0.1.0"
description = "Predictive maintenance multi-agent MicroHack for a tire factory"
requires-python = ">=3.11"
dependencies = [
    # Microsoft Agent Framework
    "agent-framework-foundry==1.12.0",
    "agent-framework-core==1.17.0",
    "azure-ai-projects==2.3.0",

    # A2A (Agent-to-Agent) Protocol
    "a2a-sdk[http-server]==1.1.2",

    # Azure dependencies
    "azure-cosmos==4.16.4",
    "azure-identity==1.25.3",
    "azure-search-documents==12.0.0",
    "azure-core==1.41.0",
    "aiohttp==3.14.3",

    # Azure AI Tracing & Monitoring
    "azure-monitor-opentelemetry==1.8.9",
    "opentelemetry-api==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.43.0",
    "opentelemetry-semantic-conventions-ai==0.5.1",

    # Data handling
    "dataclasses-json==0.6.7",

    # Development dependencies
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "ipykernel==7.3.0",
    "pytest-asyncio==1.4.0",
]
