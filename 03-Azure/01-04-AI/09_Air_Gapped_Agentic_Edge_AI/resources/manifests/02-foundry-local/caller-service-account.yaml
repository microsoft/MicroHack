# ============================================================================
# Dedicated Kubernetes ServiceAccount for Foundry Local SAT Authentication
# Reference: https://learn.microsoft.com/azure/azure-sovereign-clouds/private/foundry-local/how-to-configure-service-account-token-authentication
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: edge-agents
  labels:
    app.kubernetes.io/part-of: sovereign-edge-ai-microhack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-client
  namespace: edge-agents
automountServiceAccountToken: false
