# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: regulatory-intelligence-assistant
requiredVersions:
  azd: ">=1.34.2"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.19"
    azure.ai.projects: ">=1.0.0-beta.1"
services:
  regulatory-intelligence-assistant:
    name: regulatory-intelligence-assistant
    project: .
    host: azure.ai.agent
    language: python
    kind: hosted
    description: Chains the citation, impact and briefing agents for a regulatory change. Proposes; never approves.
    uses:
      - ai-project
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      REGINTEL_MANAGED_IDENTITY: "true"
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    deployments: []
infra:
  provider: microsoft.foundry
