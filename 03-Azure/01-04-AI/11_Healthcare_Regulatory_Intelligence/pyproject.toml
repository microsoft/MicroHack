[project]
name = "regulatory-intelligence-microhack"
version = "1.0.0"
description = "Caldova regulatory intelligence MicroHack: monitor, lake tools and the optional event-driven assistant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
orchestrator = [
    "agent-framework-core==1.14.0",
    "agent-framework-foundry==1.11.0",
    "agent-framework-foundry-hosting==1.0.0b260813",
    "azure-ai-projects>=2,<3",
    "azure-identity>=1.19,<2",
    "python-dotenv>=1,<2",
]
test = ["pytest>=8,<10"]

[tool.uv]
package = false
required-version = "==0.12.10"

[[tool.uv.index]]
name = "workshop-feed"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
