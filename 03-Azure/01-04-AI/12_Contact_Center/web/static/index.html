<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer help</title>
<style>
  :root { --brand: #0f6cbd; --bg: #f5f7fa; --agent: #ffffff; --me: #dbeafe; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: #1f2937; }
  header { background: var(--brand); color: #fff; padding: 14px 20px; font-size: 18px; font-weight: 600; }
  header small { display: block; font-weight: 400; font-size: 13px; opacity: .85; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: calc(100vh - 64px); }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .agent { background: var(--agent); align-self: flex-start; }
  .me { background: var(--me); align-self: flex-end; }
  .note { align-self: center; font-size: 13px; color: #6b7280; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
  button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>Customer help<small>You're chatting with an AI assistant. Ask for a person at any time.</small></header>
<main>
  <div id="log" aria-live="polite">
    <div class="msg agent">Hello, how can I help you today?</div>
  </div>
  <form id="form">
    <input id="text" autocomplete="off" placeholder="Type your message" aria-label="Your message" required>
    <button id="send">Send</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const text = document.getElementById("text");
  const send = document.getElementById("send");
  let conversation = null;

  function add(kind, words) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = words;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = text.value.trim();
    if (!message) return;
    add("me", message);
    text.value = "";
    send.disabled = true;
    const waiting = add("note", "Typing...");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, conversation })
      });
      const data = await res.json();
      waiting.remove();
      if (!res.ok) { add("note", data.error || "Something went wrong."); return; }
      conversation = data.conversation;
      add("agent", data.reply || "(no reply)");
    } catch (err) {
      waiting.remove();
      add("note", "Could not reach the server.");
    } finally {
      send.disabled = false;
      text.focus();
    }
  });
</script>
</body>
</html>
